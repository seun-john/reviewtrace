[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reviewtrace"
dynamic = ["version"]
description = "Trace reviewer feedback to the evidence that it was addressed in a revised document."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "ReviewTrace contributors" }]
keywords = ["docx", "peer-review", "revision", "traceability", "thesis", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13",
    "python-docx>=1.2",
    "lxml>=5",
    "PyYAML>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "lxml-stubs",
    "mcp>=1.2",
]

[project.scripts]
reviewtrace = "reviewtrace.cli:app"

[project.urls]
Homepage = "https://github.com/seun-john/reviewtrace"
Issues = "https://github.com/seun-john/reviewtrace/issues"

[tool.hatch.version]
path = "src/reviewtrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewtrace"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "UP042",  # (str, Enum) is kept for Python 3.10 compatibility
    "RUF012",
    "B008",   # typer.Option/Argument defaults
    "SIM108",
    "E501",   # long message strings; line wrapping is left to the formatter
    "RUF001", # typographic characters are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E501", "RUF001", "RUF003"]
"scripts/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/reviewtrace"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "mcp", "mcp.*"]
ignore_missing_imports = true
